<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Crew — Architecture Dashboard</title>
<style>
/* ═══════════════════════════════════════════
   CSS CUSTOM PROPERTIES
   ═══════════════════════════════════════════ */
:root {
  --bg: #0A0808;
  --bg-card: #1A1818;
  --bg-card-hover: #222020;
  --bg-surface: #141212;
  --text: #F5EDE6;
  --text-secondary: #B8A898;
  --text-muted: #7A7068;
  --border: #2A2826;
  --border-glow: rgba(240,200,160,0.12);
  --peach: #F0C8A0;
  --peach-deep: #D8A878;
  --peach-glow: rgba(240,200,160,0.15);
  --peach-dim: rgba(240,200,160,0.08);
  --positive: #70D89A;
  --positive-bg: rgba(112,216,154,0.10);
  --negative: #E08070;
  --negative-bg: rgba(224,128,112,0.10);
  --warning: #E0C870;
  --warning-bg: rgba(224,200,112,0.10);
  --mint: #70D89A;
  --mint-bg: rgba(112,216,154,0.12);
  --sky: #70B8E0;
  --sky-bg: rgba(112,184,224,0.12);
  --lavender: #A090D0;
  --lavender-bg: rgba(160,144,208,0.12);
  --coral: #E08070;
  --coral-bg: rgba(224,128,112,0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --shadow-hover: 0 8px 30px rgba(0,0,0,0.4);
  --glow: 0 0 20px rgba(240,200,160,0.06);
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes popIn { 0% { transform: scale(0.92); opacity: 0; } 60% { transform: scale(1.02); } 100% { transform: scale(1); opacity: 1; } }
@keyframes flowPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
@keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalSlide { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

.app { max-width: 1300px; margin: 0 auto; padding: 16px; }

/* ═══════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════ */
.header { text-align: center; padding: 28px 16px 16px; animation: fadeInUp 0.6s ease-out; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.header-logo { font-size: 2rem; margin-bottom: 6px; filter: drop-shadow(0 0 8px rgba(240,200,160,0.3)); }
.header h1 { font-size: 1.5rem; font-weight: 700; color: var(--peach); letter-spacing: -0.5px; }
.header p { color: var(--text-muted); font-size: 0.82rem; margin-top: 6px; }

/* ═══════════════════════════════════════════
   SUMMARY BAR
   ═══════════════════════════════════════════ */
.summary-bar { display: flex; gap: 8px; overflow-x: auto; padding: 16px 4px 8px; animation: fadeInUp 0.6s ease-out 0.1s both; -webkit-overflow-scrolling: touch; }
.summary-bar::-webkit-scrollbar { display: none; }
.summary-pill { flex: 1; min-width: 100px; background: var(--bg-card); border-radius: var(--radius-sm); padding: 12px 10px; text-align: center; box-shadow: var(--shadow); border: 1.5px solid var(--border); transition: transform 0.2s ease; }
.summary-pill:hover { transform: translateY(-2px); border-color: var(--border-glow); }
.summary-pill .icon { font-size: 1.2rem; margin-bottom: 4px; }
.summary-pill .value { font-size: 1.3rem; font-weight: 700; color: var(--text); }
.summary-pill .label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px; }

/* ═══════════════════════════════════════════
   SOURCE & CONFIDENCE BADGES
   ═══════════════════════════════════════════ */
.badge-row { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px 0 2px; justify-content: center; }
.src-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 0.55rem; font-weight: 600; letter-spacing: 0.3px; padding: 2px 6px; border-radius: 50px; text-transform: uppercase; white-space: nowrap; }
.src-badge.config   { background: rgba(112,184,224,0.12); color: #70B8E0; }
.src-badge.runtime  { background: rgba(160,144,208,0.12); color: #A090D0; }
.src-badge.journal  { background: rgba(112,216,154,0.12); color: #70D89A; }
.src-badge.backtest { background: rgba(224,200,112,0.12); color: #E0C870; }
.src-badge.env { background: rgba(208,160,128,0.12); color: #D0A080; }
.src-badge.filesystem { background: rgba(128,184,160,0.12); color: #80B8A0; }
.src-badge.code { background: rgba(240,200,160,0.10); color: #D8A878; }
.src-badge.reference { background: rgba(160,144,208,0.12); color: #A090D0; }
.src-badge.missing { background: rgba(122,112,104,0.10); color: #7A7068; }
.src-badge.unavailable { background: rgba(122,112,104,0.10); color: #7A7068; }
.src-badge.verified { background: rgba(112,216,154,0.15); color: #70D89A; }
.src-badge.partial { background: rgba(224,200,112,0.12); color: #E0C870; }
.src-badge.inferred { background: rgba(224,128,112,0.12); color: #E08070; }
.src-badge.missing-conf { background: rgba(122,112,104,0.10); color: #7A7068; }
.src-badge.discord-imported { background: rgba(160,144,208,0.25); color: #B8A8E8; }
.src-badge.discord-imported .dot { background: #B8A8E8; }
.src-badge.native-journal { background: rgba(112,216,154,0.12); color: #70D89A; }
.src-badge.native-journal .dot { background: #70D89A; }
.src-badge.combined { background: rgba(240,200,160,0.15); color: #F0C8A0; }
.src-badge.combined .dot { background: #F0C8A0; }
.src-badge .dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
.src-badge.verified .dot { background: #70D89A; }
.src-badge.partial .dot { background: #E0C870; }
.src-badge.inferred .dot { background: #E08070; }
.src-badge.missing-conf .dot { background: #7A7068; }
.src-badge.config .dot { background: #70B8E0; }
.src-badge.runtime .dot { background: #A090D0; }
.src-badge.journal .dot { background: #70D89A; }
.src-badge.backtest .dot { background: #E0C870; }
.src-badge.env .dot { background: #D0A080; }
.src-badge.filesystem .dot { background: #80B8A0; }
.src-badge.code .dot { background: #D8A878; }
.src-badge.reference .dot { background: #A090D0; }
.src-badge.missing .dot { background: #7A7068; }
.src-badge.unavailable .dot { background: #7A7068; }

/* ═══════════════════════════════════════════
   FILTER TABS
   ═══════════════════════════════════════════ */
.filter-bar { padding: 12px 4px; animation: fadeInUp 0.6s ease-out 0.2s both; }
.filter-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; -webkit-overflow-scrolling: touch; }
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab { flex-shrink: 0; padding: 6px 12px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text-muted); font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.25s ease; white-space: nowrap; user-select: none; }
.filter-tab:hover { border-color: var(--peach-dim); color: var(--text-secondary); }
.filter-tab.active { background: var(--peach-dim); border-color: var(--peach); color: var(--peach); }
.filter-tab .count { display: inline-block; background: rgba(245,237,230,0.08); border-radius: 50px; padding: 1px 6px; font-size: 0.62rem; margin-left: 4px; }
.filter-tab.active .count { background: rgba(240,200,160,0.15); }

/* ═══════════════════════════════════════════
   BOT GRID
   ═══════════════════════════════════════════ */
.bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 8px 0 16px; }
@media (min-width: 560px) { .bot-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 860px) { .bot-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1100px) { .bot-grid { grid-template-columns: repeat(4, 1fr); } }

/* ═══════════════════════════════════════════
   BOT CARD
   ═══════════════════════════════════════════ */
.bot-card { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1.5px solid var(--border); overflow: hidden; cursor: pointer; transition: all 0.3s ease; animation: popIn 0.4s ease-out both; }
.bot-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--border-glow); }
.bot-card.disabled-card { opacity: 0.55; cursor: default; }
.bot-card.disabled-card:hover { transform: none; box-shadow: var(--shadow); }
.bot-card.hidden { display: none; }
.card-scene { height: 80px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
.card-scene .floor { position: absolute; bottom: 0; left: 0; right: 0; height: 20px; border-radius: var(--radius) var(--radius) 0 0; opacity: 0.6; }
.character { position: relative; z-index: 2; font-size: 2rem; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }
.mini-badge { position: absolute; z-index: 3; font-size: 0.5rem; letter-spacing: -0.5px; color: var(--text-muted); background: rgba(26,24,24,0.85); padding: 2px 5px; border-radius: 4px; white-space: nowrap; border: 1px solid var(--border); }
.mini-badge.top-right { top: 6px; right: 6px; }
.bot-card[data-status="running"] .card-scene .floor { background: linear-gradient(135deg, rgba(112,216,154,0.3), rgba(112,216,154,0.1)); }
.bot-card[data-status="error"] .card-scene .floor { background: linear-gradient(135deg, rgba(224,128,112,0.3), rgba(224,128,112,0.1)); }
.bot-card[data-status="idle"] .card-scene .floor { background: linear-gradient(135deg, rgba(184,168,152,0.2), rgba(184,168,152,0.05)); }
.bot-card[data-status="disabled"] .card-scene .floor { background: linear-gradient(135deg, rgba(122,112,104,0.15), rgba(122,112,104,0.05)); }

.card-info { padding: 10px 12px 8px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
.card-name { font-size: 0.85rem; font-weight: 700; color: var(--text); }
.card-id { font-size: 0.55rem; color: var(--text-muted); font-family: monospace; }
.card-strategy { font-size: 0.68rem; color: var(--peach-deep); margin-bottom: 4px; font-weight: 600; }
.card-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.meta-pill { font-size: 0.55rem; padding: 2px 6px; border-radius: 50px; background: rgba(245,237,230,0.06); color: var(--text-muted); border: 1px solid var(--border); white-space: nowrap; }
.card-metrics { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
.metric-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.68rem; padding: 2px 0; }
.metric-label { color: var(--text-muted); }
.metric-value { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 3px; }
.metric-value.empty-val { color: var(--text-muted); font-style: italic; font-weight: 400; }
.metric-value.positive { color: var(--positive); }
.metric-value.negative { color: var(--negative); }
.card-story { font-size: 0.68rem; line-height: 1.3; color: var(--text-secondary); padding: 6px 8px; background: var(--bg-surface); border-radius: var(--radius-xs); margin-bottom: 4px; border-left: 2px solid var(--peach-dim); }
.card-details { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s ease; background: var(--bg-surface); border-top: 1px solid var(--border); }
.bot-card.expanded .card-details { max-height: 500px; padding: 10px 12px; }
.card-details h4 { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.detail-row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 0.68rem; border-bottom: 1px dashed rgba(42,40,38,0.5); }
.detail-label { color: var(--text-muted); }
.detail-value { font-weight: 600; color: var(--text); }

/* ═══════════════════════════════════════════
   SECTION HEADERS
   ═══════════════════════════════════════════ */
.section-header { display: flex; align-items: center; gap: 8px; padding: 10px 4px 6px; margin-bottom: 4px; }
.section-header h2 { font-size: 1rem; font-weight: 700; color: var(--peach); }
.section-header .icon { font-size: 1.1rem; }
.section-header .ref { font-size: 0.55rem; color: var(--text-muted); margin-left: auto; font-family: monospace; }
.section-desc { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 8px; padding: 0 4px; line-height: 1.4; }

/* ═══════════════════════════════════════════
   SYSTEM ARCHITECTURE MAP
   ═══════════════════════════════════════════ */
.arch-section { margin-top: 16px; animation: fadeInUp 0.6s ease-out 0.25s both; }
.arch-layers { display: flex; flex-direction: column; gap: 0; }
.arch-layer { background: var(--bg-card); border-radius: var(--radius-sm); border: 1.5px solid var(--border); padding: 10px 12px; transition: border-color 0.2s ease; position: relative; }
.arch-layer:hover { border-color: var(--border-glow); }
.arch-layer-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.arch-layer-header .layer-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.arch-layer-header .layer-icon { font-size: 0.85rem; }
.arch-layer-header .layer-count { font-size: 0.55rem; color: var(--text-muted); margin-left: auto; font-family: monospace; }
.arch-nodes { display: flex; flex-wrap: wrap; gap: 5px; }
.arch-node { display: inline-flex; align-items: center; gap: 4px; font-size: 0.62rem; padding: 4px 8px; border-radius: var(--radius-xs); background: var(--bg-surface); border: 1px solid var(--border); white-space: nowrap; transition: all 0.2s ease; cursor: pointer; position: relative; }
.arch-node:hover { border-color: var(--border-glow); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.arch-node .node-status { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.arch-node.node-error { border-color: var(--negative); }
.arch-node.node-error .node-status { background: var(--negative); animation: flowPulse 2s infinite; }
.arch-node.node-idle { border-color: var(--text-muted); }
.arch-node.node-idle .node-status { background: var(--text-muted); }
.arch-node.node-ok { border-color: var(--positive); }
.arch-node.node-ok .node-status { background: var(--positive); }
.arch-node.node-disabled { opacity: 0.5; }
.arch-node.node-disabled .node-status { background: #7A7068; }
.arch-node.node-warn { border-color: var(--warning); }
.arch-node.node-warn .node-status { background: var(--warning); }
.arch-node.node-blocked { border-color: var(--negative); opacity: 0.7; }
.arch-node.node-blocked .node-status { background: var(--negative); }
.arch-node .node-conf-dot { width: 4px; height: 4px; border-radius: 50%; margin-left: 2px; }
.layer-arrow { display: flex; flex-direction: column; align-items: center; padding: 3px 0; background: var(--bg); }
.layer-arrow-line { width: 1px; height: 8px; background: var(--border); }
.layer-arrow-head { color: var(--text-muted); font-size: 0.5rem; line-height: 1; }
.layer-arrow-links { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; margin: 2px 0; }
.link-pill { font-size: 0.42rem; padding: 1px 4px; border-radius: 3px; border: 1px solid; white-space: nowrap; }
.link-pill.link-verified { border-color: var(--positive); color: var(--positive); background: rgba(112,216,154,0.08); }
.link-pill.link-inferred { border-color: var(--warning); color: var(--warning); background: rgba(224,200,112,0.06); border-style: dashed; }

/* SIGNAL LIFECYCLE FLOW */
.flow-section { margin-top: 16px; animation: fadeInUp 0.6s ease-out 0.3s both; }
.flow-pipeline { display: flex; flex-direction: column; gap: 0; }
.flow-step { background: var(--bg-card); border-radius: var(--radius-sm); border: 1.5px solid var(--border); padding: 8px 12px; transition: border-color 0.2s ease; }
.flow-step:hover { border-color: var(--border-glow); }
.flow-step-header { display: flex; align-items: center; gap: 6px; font-size: 0.62rem; font-weight: 700; color: var(--peach-deep); flex-wrap: wrap; }
.flow-step-header .step-num { width: 18px; height: 18px; border-radius: 50%; background: var(--peach-dim); color: var(--peach); display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 700; flex-shrink: 0; }
.flow-step-header .step-file { font-size: 0.5rem; color: var(--text-muted); font-weight: 400; font-family: monospace; margin-left: auto; }
.flow-step-body { font-size: 0.6rem; color: var(--text-secondary); margin-top: 3px; line-height: 1.3; }
.flow-step-body .flow-detail { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.flow-step-body .flow-detail span { background: var(--bg-surface); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border); font-size: 0.55rem; white-space: nowrap; }
.flow-arrow { text-align: center; font-size: 0.55rem; color: var(--text-muted); padding: 2px 0; line-height: 1; }
.flow-fork { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 2px 0; }
.flow-fork .flow-branch { background: var(--bg-card); border-radius: var(--radius-xs); border: 1.5px solid var(--border); padding: 6px 8px; }
.flow-fork .flow-branch.blocked { border-color: var(--negative); opacity: 0.7; }
.flow-fork .flow-branch .branch-title { font-size: 0.55rem; font-weight: 700; color: var(--peach-deep); margin-bottom: 2px; }
.flow-fork .flow-branch .branch-desc { font-size: 0.55rem; color: var(--text-muted); line-height: 1.3; }

/* CONNECTION EXPLORER */
.conn-section { margin-top: 16px; animation: fadeInUp 0.6s ease-out 0.35s both; }
.conn-filters { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.conn-filter-btn { padding: 4px 8px; border-radius: 50px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); font-size: 0.6rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
.conn-filter-btn:hover { border-color: var(--peach-dim); }
.conn-filter-btn.active { border-color: var(--peach); color: var(--peach); background: var(--peach-dim); }
.conn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px; }
.conn-item { display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: var(--bg-card); border-radius: var(--radius-xs); border: 1px solid var(--border); font-size: 0.55rem; cursor: pointer; transition: all 0.2s ease; }
.conn-item:hover { border-color: var(--border-glow); background: var(--bg-card-hover); }
.conn-item .conn-from { color: var(--peach-deep); font-weight: 600; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn-item .conn-arrow { color: var(--text-muted); flex-shrink: 0; }
.conn-item .conn-to { color: var(--text-secondary); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn-item .conn-type { font-size: 0.45rem; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
.conn-item .conn-status { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.conn-item.conn-verified .conn-status { background: var(--positive); }
.conn-item.conn-inferred .conn-status { background: var(--warning); }

/* DEPENDENCY GRAPH */
.dep-section { margin-top: 16px; animation: fadeInUp 0.6s ease-out 0.4s both; }
.dep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.dep-card { background: var(--bg-card); border-radius: var(--radius-sm); padding: 8px 10px; border: 1.5px solid var(--border); transition: border-color 0.2s ease; }
.dep-card:hover { border-color: var(--border-glow); }
.dep-card .dep-panel { font-size: 0.65rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.dep-card .dep-source { font-size: 0.55rem; color: var(--text-muted); padding: 1px 0; display: flex; align-items: center; gap: 3px; }

/* CONFIDENCE HEATMAP */
.heatmap-section { margin-top: 16px; animation: fadeInUp 0.6s ease-out 0.45s both; }
.heatmap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.heatmap-card { background: var(--bg-card); border-radius: var(--radius-sm); padding: 8px 10px; border: 1.5px solid var(--border); transition: border-color 0.2s ease; }
.heatmap-card:hover { border-color: var(--border-glow); }
.heatmap-card .hm-category { font-size: 0.65rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.heatmap-item { font-size: 0.58rem; color: var(--text-secondary); padding: 2px 0; display: flex; align-items: center; gap: 4px; justify-content: space-between; }
.heatmap-item .hm-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.heatmap-summary { font-size: 0.5rem; color: var(--text-muted); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }

/* DATA PROVENANCE PANEL */
.prov-section { margin-top: 16px; animation: fadeInUp 0.6s ease-out 0.5s both; }
.prov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
