parameter_grid:
  extension_modes:
    - atr_multiple
    - points
  extension_values:
    - 2.0
    - 3.0
  volume_rank_values:
    - 0.7
    - 0.85
  slope_score_values:
    - 50.0
    - 60.0
  signal_timeframes:
    - 1m
    - 5m
  target_r_values:
    - 1.0
    - 1.5
  stop_buffer_points:
    - 0.0
    - 0.25

