signal_expiry_sessions: 2
entry_mode: next_bar_open
stop_reference: signal_bar_high
stop_buffer_points: 0.0
target_r: 1.5
intrabar_priority: stop_first
spread_points: 0.0
slippage_points: 0.0
commission_points: 0.0
borrow_cost_points_per_day: 0.0
force_exit_minutes_before_close: 5

replay:
  use_kill_zones_for_entry: true
  use_5m_context_filter: false
  allowed_5m_trend_states:
    - down
    - transition
  require_5m_below_vwap_for_entry: false
  pre_entry_invalidation_on_close_above_vwap: true
  post_entry_invalidation_on_close_above_vwap: true
  add_size_pct_of_initial: 40.0
  max_adds_per_trade: 1

